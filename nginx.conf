server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Try files for client-side routing
    # This block ensures that all unknown paths are redirected to index.html,
    # allowing React Router to handle the routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache control for static assets (optimize browser caching)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg|eot)$ {
        expires 30d; # Cache assets for 30 days
        add_header Cache-Control "public, no-transform";
    }

    # Optional: Gzip compression for faster delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Basic error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
