
name: Build & Publish Docker Image

on:
  push:
    branches:
      - feat/victor/ebanqo-widget


env:
  IMAGE_NAME: "ghcr.io/tradersofafricateam"
  CONTAINER_NAME: "tradersofafrica"
  CONTAINER_PORT: "80"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout
      packages: write # Required to push to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Export ALL_SECRETS to .env
        run: |
          cat << 'EOF' > .env
            REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND }}
          EOF
        shell: bash

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            "${{ env.IMAGE_NAME }}/${{ env.CONTAINER_NAME }}:${{ github.sha }}"
            "${{ env.IMAGE_NAME }}/${{ env.CONTAINER_NAME }}:latest"
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID:     ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:     ${{ secrets.ARM_TENANT_ID }}

    permissions:
      contents: read # Required for actions/checkout
      packages: read # Required to pull from GHCR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            infrastructure

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.12.2"
          working_directory: infrastructure

      - name: Create terraform tfvars file
        run: |
          cat <<EOF > infrastructure/terraform.tfvars
          location             = "southafricanorth"
          container_image      = "${{ env.IMAGE_NAME }}/${{ env.CONTAINER_NAME }}:${{ github.sha }}"
          container_name       = "${{ env.CONTAINER_NAME }}"
          ghcr_registry_server = "ghcr.io"
          ghcr_username        = "${{ github.actor }}"
          ghcr_password        = "${{ secrets.GH_PAT }}"
          container_port       = "${{ env.CONTAINER_PORT }}"
          node_env             = "production"
          domain_name          = "tradersofafrica.com"
          EOF

      - name: Terraform Init
        run: |
         cd infrastructure
         terraform init

      - name: Terraform Apply
        run: |
          cd infrastructure
          terraform apply -auto-approve
