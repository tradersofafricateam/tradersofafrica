dispatch:
  #landing page
  - url: 'tradersofafrica.com/*'
    service: tradersofafrica
  #marketplace
  - url: "marketplace.tradersofafrica.com/*"
    service: marketplace
  - url: "marketplase.tradersofafrica.com/*"
    service: marketplace
  #admin-marketplace
  - url: "admin-marketplace.tradersofafrica.com/*" 
    service: admin-marketplace
  #momo-marketplace
  - url: "momo-marketplase.tradersofafrica.com/*" 
    service: momo-prod
  #marketplace-server
  - url: "api.tradersofafrica.com/*"
    service: marketplace-server-prod
  #Tofa-pay-frontend
  - url: "tofapay.tradersofafrica.com/*"
    service: tofa-pay-new
  #tofa-pay-server
  - url: "tofapay-api.tradersofafrica.com/*"
    service: tofa-pay-server


